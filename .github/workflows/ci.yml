# CI (etapas 1.1 a 4.2): build + tests .NET, Front-End, auditoría de dependencias, compose y escaneo de secretos.
# Los E2E (Playwright) corren contra el compose levantado en local: ver docs/ETAPA_4_1_FRONTEND.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Secunitec.slnx && dotnet tool restore

      - name: Build (warnings como errores)
        run: dotnet build Secunitec.slnx -c Release --no-restore

      - name: Formato
        run: dotnet format Secunitec.slnx --verify-no-changes --no-restore

      # EF 9+ lanza al arrancar si el modelo no coincide con el snapshot: una migración olvidada tumbaría el servicio.
      - name: Migraciones al día con el modelo
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes --configuration Release --no-build \
            -p src/Billing/Secunitec.Billing.Infrastructure -s src/Billing/Secunitec.Billing.Infrastructure
          dotnet dotnet-ef migrations has-pending-model-changes --configuration Release --no-build \
            -p src/Identity/Secunitec.Identity -s src/Identity/Secunitec.Identity

      - name: Test
        run: dotnet test Secunitec.slnx -c Release --no-build --results-directory TestResults -- --report-xunit-trx

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Front-End lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            src/Frontend/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: E2E compila (Playwright corre contra el compose en local)
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile && pnpm exec tsc --noEmit -p .

      # Identity (Razor) usa una copia de los tokens de diseño del SPA: deben ser idénticos.
      - name: Tokens de diseño sincronizados con Identity
        working-directory: .
        run: diff src/Frontend/src/styles/tokens.css src/Identity/Secunitec.Identity/wwwroot/account/assets/tokens.css

  dependencias:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # dotnet list package --vulnerable termina en 0 aunque encuentre vulnerables: se revisa el JSON.
      - name: NuGet (directas y transitivas)
        run: |
          dotnet restore Secunitec.slnx
          dotnet list Secunitec.slnx package --vulnerable --include-transitive --format json > vulnerables.json
          jq -r '.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[] | select(.vulnerabilities) | "\(.id) \(.resolvedVersion)"' vulnerables.json | tee hallazgos.txt
          test ! -s hallazgos.txt

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: pnpm audit (Front-End y E2E)
        run: |
          (cd src/Frontend && pnpm audit --audit-level=high)
          (cd tests/e2e && pnpm audit --audit-level=high)

  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar sintaxis y referencias del compose (todos los perfiles)
        run: cp .env.example .env && docker compose --profile billing --profile security config --quiet
      # Cierre: con el .env de ejemplo, `docker compose up` sin flags levanta el sistema completo (COMPOSE_PROFILES).
      - name: docker compose up sin flags incluye el Front-End y los tres servicios
        run: |
          services=$(docker compose config --services)
          for s in frontend gateway identity billing postgres mongo redis; do
            echo "$services" | grep -qx "$s" || { echo "Falta $s sin --profile"; exit 1; }
          done
      # 5.2: el overlay de observabilidad sobre el compose principal, con su perfil.
      - name: Validar el compose con la observabilidad (Fase 4)
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.observability.yml
          --profile billing --profile security --profile observability config --quiet
      - name: Validar la configuración del collector, Prometheus y Loki
        run: |
          docker run --rm -v "$PWD/infra/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.161.0 validate --config=/etc/otelcol/config.yaml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/prometheus/prometheus.yml:/p.yml:ro" \
            prom/prometheus:v3.14.0 check config /p.yml
          docker run --rm -v "$PWD/infra/loki/loki.yaml:/etc/loki/loki.yaml:ro" --tmpfs /loki:uid=10001,gid=10001 \
            grafana/loki:3.7.8 -config.file=/etc/loki/loki.yaml -verify-config
