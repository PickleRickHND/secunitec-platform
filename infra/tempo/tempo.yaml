# Fase 4 (R19): Tempo 3 en modo monolítico (target all, sin Kafka), con almacenamiento local en el volumen tempo_data.
# El generador de métricas arma el service graph (gateway → billing → postgresql) y lo escribe en Prometheus.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # Solo lo recibe el collector, por la red observability.
        grpc:
          endpoint: 0.0.0.0:4317

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: classic

usage_report:
  reporting_enabled: false
