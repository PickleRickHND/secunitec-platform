# Redis de Secunitec (R08): contadores del rate limiting del gateway y caché de lecturas de Billing.
# La contraseña llega por --requirepass desde .env (docker-compose.yml); nunca se escribe aquí.
bind 0.0.0.0
protected-mode yes

# Datos efímeros: sin AOF ni snapshots RDB (el contenedor corre con el sistema de archivos de solo lectura).
appendonly no
save ""

maxmemory 128mb
maxmemory-policy allkeys-lru

# 2.1 / A05: comandos peligrosos deshabilitados. Un cliente con la contraseña no puede borrar todo (FLUSHALL,
# FLUSHDB), reconfigurar el servidor (CONFIG) ni inspeccionar su memoria (DEBUG). StackExchange.Redis tolera que
# CONFIG falle al conectar, y los scripts Lua del rate limiting no usan ninguno (tests/Secunitec.Billing.Infrastructure.Tests).
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
