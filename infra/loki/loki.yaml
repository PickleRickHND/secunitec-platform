# Fase 4 (R19): Loki monolítico con almacenamiento en el volumen loki_data. Recibe los logs por OTLP (/otlp) desde el
# collector; trace_id y span_id quedan como metadatos estructurados para saltar de un log a su traza en Tempo.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h
  # Las ráfagas de la prueba de estrés generan muchos logs de golpe (5.3).
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
