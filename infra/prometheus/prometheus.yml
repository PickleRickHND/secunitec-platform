# Fase 4 (R19): Prometheus en la red observability (internal, sin puertos publicados). Cada 5 s para que los
# dashboards de la prueba de estrés (5.3) muestren los picos de 429 con resolución suficiente.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Métricas de gateway, identity y billing que llegan por OTLP al collector.
  - job_name: otel-collector
    # honor_labels: conserva job/instance del recurso OTel (service.name) en vez de reemplazarlos por los del scrape.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # CPU, memoria, red y throttling por contenedor (Método USE).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Solo los contenedores del compose; el resto de la VM de Docker no interesa.
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
